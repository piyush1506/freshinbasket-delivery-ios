name: freshinbasket_delivery
description: "FreshInBasket Delivery Rider Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.2.5
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpg
    - assets/deliveryboyappicon.png
    - assets/deliveryboyappicon.jpg
    - assets/scooter_3d.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/deliveryboyappicon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/deliveryboyappicon.png"
  min_sdk_size: 21
